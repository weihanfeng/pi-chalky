# Publish @chalky/chalky to npm. Runs only when someone clicks "Run workflow" on GitHub
# (Actions tab -> "Publish to npm"), typing the version to release. That click is the approval.
#
# What it does: sets the version in package.json, publishes to npm, then commits the bump to main
# and tags it vX.Y.Z, then makes the GitHub release (don't make one by hand first).
# No npm token: npm trusts this workflow file (Trusted Publishing, OIDC).
name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.6 (no leading v)"
        required: true
        type: string

permissions:
  contents: write   # push the version commit and tag
  id-token: write   # let GitHub hand npm a short-lived signed token (Trusted Publishing)

concurrency: publish   # never two releases at once

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.2
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11.21.2

      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "::error::'$VERSION' is not a version like 0.1.6"; exit 1; }
          name=$(node -p 'require("./package.json").name')
          if npm view "$name@$VERSION" version >/dev/null 2>&1; then echo "::error::$name@$VERSION is already on npm"; exit 1; fi
          # A GitHub release made by hand makes its tag too, and the tag push at the end would then fail after
          # publishing. This workflow makes the release itself.
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then echo "::error::tag v$VERSION already exists on GitHub (a release made by hand?). Delete it, or release another version"; exit 1; fi

      - name: Set the version
        env:
          VERSION: ${{ inputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Install from the lockfile so bundleDependencies (xlsx) are in node_modules when npm packs:
      # without it they're silently left out of the tarball and npm never fetches them on install.
      - run: npm ci

      - name: Check the bundled dependencies are packed
        run: |
          for dep in $(node -p 'require("./package.json").bundleDependencies.join(" ")'); do
            npm pack --dry-run --json | node -e '
              const files = JSON.parse(require("fs").readFileSync(0, "utf8"))[0].files.map((f) => f.path);
              if (!files.some((p) => p.startsWith(`node_modules/${process.argv[1]}/`))) { console.log(`::error::${process.argv[1]} is not in the package`); process.exit(1); }
            ' "$dep"
          done

      - name: Publish
        run: npm publish

      - name: Commit and tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $VERSION" || echo "version already $VERSION in package.json"
          git tag "v$VERSION"
          git push origin main "v$VERSION"

      - name: GitHub release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --verify-tag --generate-notes --title "v$VERSION"
